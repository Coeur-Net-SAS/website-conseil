<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f3a5f"/>
      <stop offset="100%" stop-color="#0f1e3a"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>

  <!-- Poste de travail -->
  <g transform="translate(120,190)">
    <rect x="0" y="0" width="260" height="170" rx="10" fill="#0f1e3a" stroke="#94a3b8" stroke-width="3"/>
    <rect x="18" y="20" width="224" height="16" rx="4" fill="#334155"/>
    <rect x="18" y="48" width="180" height="10" rx="3" fill="#475569"/>
    <rect x="18" y="66" width="200" height="10" rx="3" fill="#475569"/>
    <rect x="18" y="84" width="150" height="10" rx="3" fill="#475569"/>
    <rect x="18" y="102" width="190" height="10" rx="3" fill="#475569"/>
    <rect x="18" y="120" width="120" height="10" rx="3" fill="#475569"/>
    <rect x="100" y="170" width="60" height="22" fill="#94a3b8"/>
    <rect x="60" y="192" width="140" height="10" rx="4" fill="#94a3b8"/>
    <text x="130" y="240" text-anchor="middle" fill="#cbd5e1" font-size="22">Données de l'entreprise</text>
  </g>

  <!-- Flux de données qui fuit -->
  <g stroke="#f59e0b" stroke-width="4" fill="none" stroke-dasharray="14 10">
    <path d="M400 270 C 520 200, 640 340, 760 270"/>
  </g>
  <g fill="#f59e0b">
    <rect x="455" y="226" width="26" height="32" rx="3"/>
    <rect x="560" y="268" width="26" height="32" rx="3"/>
    <rect x="665" y="244" width="26" height="32" rx="3"/>
  </g>
  <polygon points="760,258 784,270 760,282" fill="#f59e0b"/>

  <!-- Nuage IA -->
  <g transform="translate(790,180)">
    <path d="M60 150 C 10 150, 0 100, 40 88 C 30 40, 90 20, 120 50 C 140 10, 220 10, 230 70 C 280 70, 290 140, 240 150 Z" fill="#0f1e3a" stroke="#94a3b8" stroke-width="3"/>
    <text x="148" y="118" text-anchor="middle" fill="#e2e8f0" font-size="40" font-weight="700">IA</text>
    <text x="148" y="200" text-anchor="middle" fill="#cbd5e1" font-size="22">Service grand public</text>
  </g>

  <!-- Bouclier / règle -->
  <g transform="translate(555,330)">
    <path d="M45 0 L90 16 L90 52 C 90 82, 66 100, 45 110 C 24 100, 0 82, 0 52 L0 16 Z" fill="#0f766e" stroke="#5eead4" stroke-width="3"/>
    <path d="M26 54 L41 69 L66 40" stroke="#ecfeff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="600" y="530" text-anchor="middle" fill="#ffffff" font-size="50" font-weight="800">Shadow IA : 7 règles</text>
  <text x="600" y="580" text-anchor="middle" fill="#5eead4" font-size="26">pour utiliser l'IA générative sans fuite de données</text>
  <text x="600" y="90" text-anchor="middle" fill="#94a3b8" font-size="22" letter-spacing="2">CYBERMOIS 2026 · CŒUR-NET</text>
</svg>
