<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f3a5f"/>
      <stop offset="100%" stop-color="#0f1e3a"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative corner brackets -->
  <g opacity="0.35" stroke="#0f766e" stroke-width="2" fill="none">
    <rect x="980" y="70" width="70" height="70" rx="6"/>
    <text x="1015" y="115" text-anchor="middle" fill="#0f766e" font-size="30" font-family="JetBrains Mono, monospace" stroke="none">{ }</text>
    <circle cx="1015" cy="140" r="5" fill="#0f766e" stroke="none"/>
    <line x1="1015" y1="145" x2="1015" y2="230"/>
    <circle cx="1015" cy="230" r="5" fill="#0f766e" stroke="none"/>
  </g>
  <g opacity="0.35" stroke="#94a3b8" stroke-width="2" fill="none">
    <rect x="1060" y="230" width="80" height="80" rx="6"/>
    <text x="1100" y="280" text-anchor="middle" fill="#94a3b8" font-size="30" font-family="JetBrains Mono, monospace" stroke="none">[ ]</text>
    <circle cx="1100" cy="230" r="5" fill="#94a3b8" stroke="none"/>
    <line x1="1015" y1="230" x2="1100" y2="230"/>
  </g>

  <!-- Kubernetes wheel icon -->
  <g transform="translate(120,110)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    <g stroke="#ffffff" stroke-width="3">
      <line x1="0" y1="-34" x2="0" y2="-14"/>
      <line x1="29.4" y1="-17" x2="12" y2="-7"/>
      <line x1="29.4" y1="17" x2="12" y2="7"/>
      <line x1="0" y1="34" x2="0" y2="14"/>
      <line x1="-29.4" y1="17" x2="-12" y2="7"/>
      <line x1="-29.4" y1="-17" x2="-12" y2="-7"/>
    </g>
  </g>

  <!-- Lock / seal icon -->
  <g transform="translate(210,110)">
    <rect x="-22" y="-4" width="44" height="34" rx="6" fill="#0f766e"/>
    <path d="M -14,-4 L -14,-16 A 14,14 0 0 1 14,-16 L 14,-4" fill="none" stroke="#0f766e" stroke-width="6"/>
    <circle cx="0" cy="13" r="5" fill="#ffffff"/>
  </g>

  <!-- Title -->
  <text x="120" y="280" fill="#ffffff" font-size="56" font-weight="700">Sealed Secrets</text>
  <text x="120" y="345" fill="#ffffff" font-size="56" font-weight="700">Kubernetes</text>

  <!-- Subtitle -->
  <text x="120" y="400" fill="#2dd4bf" font-size="28" font-weight="600" font-family="JetBrains Mono, monospace">kubeseal · script Bash · GitOps</text>

  <!-- Divider -->
  <line x1="120" y1="440" x2="520" y2="440" stroke="#334155" stroke-width="2"/>

  <text x="120" y="480" fill="#94a3b8" font-size="20">Chiffrer, faire tourner et déployer des secrets</text>
  <text x="120" y="508" fill="#94a3b8" font-size="20">Kubernetes en toute sécurité depuis Git</text>
</svg>
